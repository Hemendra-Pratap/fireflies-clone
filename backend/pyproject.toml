[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fireflies-backend"
version = "0.1.0"
description = "Backend scaffold for the FireFlies Clone monorepo."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
